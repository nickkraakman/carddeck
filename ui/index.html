<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CardDeck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <button id="btn-open" class="primary">Open…</button>
  <button id="btn-cal" title="Open a built-in test card for the first test print">Calibration card</button>
  <div id="meta" class="meta"></div>
  <div class="spacer"></div>
  <div class="seg" id="view-seg" role="group" aria-label="View">
    <button data-view="front" class="on">Front</button>
    <button data-view="back">Back</button>
    <button data-view="both">Both</button>
  </div>
  <div class="zoom">
    <button id="zoom-out" title="Zoom out">−</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-fit" title="Fit to window">Fit</button>
  </div>
</header>

<main>
  <section id="viewer">
    <div id="warnings" class="warnings hidden"></div>
    <div id="empty" class="empty">
      <div class="empty-card">
        <h1>CardDeck</h1>
        <p>Drop a <code>.card</code> file here, or click <b>Open…</b></p>
        <p class="small">No file handy? Try the <b>Calibration card</b> before your first print.</p>
      </div>
    </div>
    <div id="stage" class="stage hidden"></div>
    <div id="print-preview" class="print-preview hidden"></div>
  </section>

  <aside id="panel">
    <h2>Colour <span class="badge info">preview only</span></h2>
    <div id="colour-box">
      <label class="row">Colour Correct
        <select id="cc-correction"></select>
      </label>
      <div class="adj-head"><span>Adjustments</span><button id="cc-reset" title="Reset sliders and Colour Correct to Hub's defaults (Gamma 1)">↻ Reset</button></div>
      <div class="slider"><label for="cc-brightness">Brightness</label><input id="cc-brightness" type="range" min="-0.5" max="0.5" step="any" value="0"><output id="cc-brightness-v"></output></div>
      <div class="slider"><label for="cc-contrast">Contrast</label><input id="cc-contrast" type="range" min="-15" max="15" step="any" value="0"><output id="cc-contrast-v"></output></div>
      <div class="slider"><label for="cc-saturation">Saturation</label><input id="cc-saturation" type="range" min="-5" max="5" step="any" value="0"><output id="cc-saturation-v"></output></div>
      <div class="slider"><label for="cc-red">Red</label><input id="cc-red" type="range" min="0.5" max="1.5" step="any" value="1"><output id="cc-red-v"></output></div>
      <div class="slider"><label for="cc-green">Green</label><input id="cc-green" type="range" min="0.5" max="1.5" step="any" value="1"><output id="cc-green-v"></output></div>
      <div class="slider"><label for="cc-blue">Blue</label><input id="cc-blue" type="range" min="0.5" max="1.5" step="any" value="1"><output id="cc-blue-v"></output></div>
      <label class="check"><input id="cc-autosave" type="checkbox" checked> Save into the .card file when I change something</label>
      <div class="inline"><button id="cc-save">Save to .card</button><span id="cc-state" class="note"></span></div>
      <div id="cc-note" class="note"></div>
    </div>

    <h2>Print</h2>

    <label class="row">Printer
      <span class="inline">
        <select id="printer"></select>
        <button id="printer-refresh" title="Refresh list (lpstat -p)">↻</button>
      </span>
    </label>
    <div id="printer-note" class="note"></div>

    <label class="row">Sides
      <select id="sides">
        <option value="both">Both (front + back)</option>
        <option value="front">Front only</option>
        <option value="back">Back only</option>
      </select>
    </label>
    <label class="row">Copies <input id="copies" type="number" min="1" max="99" value="1"></label>

    <fieldset>
      <legend>Overcoat</legend>
      <label class="check"><input id="oc-front" type="checkbox" checked> Front</label>
      <label class="check"><input id="oc-back" type="checkbox" checked> Back</label>
    </fieldset>

    <label class="check" title="The driver cannot do Brightness/Contrast/Saturation/RGB or Gamma 1/2. Off: they only change the preview."><input id="bake" type="checkbox"> Also apply sliders + Gamma 1/2 to the printed bitmap</label>

    <details>
      <summary>Advanced: extra printer options</summary>
      <textarea id="extra" rows="3" placeholder="one per line, e.g.&#10;CFRotation=1Rotation&#10;Sharpness=2"></textarea>
    </details>

    <div class="buttons">
      <button id="btn-preview">Preview print pages</button>
      <button id="btn-save">Save job (PDF + PNG)…</button>
      <button id="btn-print" class="danger">Print…</button>
    </div>
    <div id="status" class="status"></div>
    <div id="problems" class="problems"></div>
    <details id="cmd-box" class="hidden">
      <summary>lp command</summary>
      <pre id="cmd"></pre>
    </details>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
